name: SEO

on:
  pull_request:            # guardrail: block a PR that introduces an SEO error
  push:
    branches: [main]       # the blog auto-publisher pushes straight to main and never
                           # opens a PR, so pull_request alone never sees its commits
  schedule:
    - cron: '0 14 * * 5'   # Fridays ~9am CT
    - cron: '0 19 * * 5'   # backstop, Fridays ~2pm CT. GitHub silently dropped the
                           # 09:00 run on 2026-08-28 — scheduled workflows are
                           # best-effort and the on-the-hour slots are the most
                           # congested. The guard below stops the two colliding.
  workflow_dispatch:        # manual run button / gh workflow run

jobs:
  audit:                   # runs on every event (repo scan, no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SEO audit
        run: |
          set -o pipefail
          python3 scripts/seo-audit.py | tee audit.txt
      - name: Report to job summary
        if: always()
        run: |
          {
            echo '## SEO audit'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  conventions:             # catches auto-published posts built from a stale template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site conventions
        run: |
          set -o pipefail
          python3 scripts/conventions-check.py | tee conventions.txt
      - name: Report to job summary
        if: always()
        run: |
          {
            echo '## Site conventions'
            echo '```'
            cat conventions.txt
            echo '```'
            echo 'Failures on a `blog/` post are usually a stale auto-publish template.'
            echo 'Fix with: `python3 scripts/normalize-post.py blog/<the-post>.html`'
          } >> "$GITHUB_STEP_SUMMARY"

  gsc-report:              # weekly Search Console digest (needs the GSC_SA_KEY secret)
    # Fridays (schedule) + manual runs only — NOT on every push, or the daily
    # blog auto-publisher would fire this digest to Slack every day.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Two Friday crons means this can fire twice. Skip if a run today already
      # produced the digest, so the backstop only covers a genuine miss and
      # never double-posts to Slack.
      - name: Skip if this week's digest already went out
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          done_already=$(gh api "repos/${{ github.repository }}/actions/workflows/seo-audit.yml/runs?per_page=30" \
            --jq "[.workflow_runs[]
                   | select(.created_at[0:10] == \"$today\")
                   | select(.id != ${{ github.run_id }})
                   | select(.conclusion == \"success\")] | length")
          echo "successful runs earlier today: $done_already"
          if [ "$done_already" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Digest already sent today — skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != 'true'
        with: { python-version: '3.12' }
      - run: pip install --quiet google-api-python-client google-auth
        if: steps.dedupe.outputs.skip != 'true'
      - name: Weekly Search Console report
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          set -o pipefail
          python3 scripts/gsc-report.py | tee gsc.txt
      - name: Report to job summary
        # always() so a failed report still surfaces, but not when we skipped —
        # gsc.txt won't exist and cat would fail the job for no reason.
        if: always() && steps.dedupe.outputs.skip != 'true'
        run: |
          {
            echo '## Search Console — weekly'
            echo '```'
            cat gsc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
